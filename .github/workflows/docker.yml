# Multi-arch image ghcr.io/awake-devel/magnetar (linux/amd64 + linux/arm64), ARCHITECTURE.md D39.
# Each architecture builds natively on its own runner (no QEMU), pushes by digest only, and a
# final job merges the digests into one manifest list and tags it:
#   tag vX.Y.Z      -> X.Y.Z and latest
#   tag vX.Y.Z-rc1  -> X.Y.Z-rc1 only (prereleases never move latest)
#   push to main    -> edge (the newest main build, for testing before a release)
name: docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}

env:
  IMAGE: ghcr.io/awake-devel/magnetar

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Platform slug
        env:
          PLATFORM: ${{ matrix.platform }}
        run: echo "PLATFORM_PAIR=${PLATFORM//\//-}" >>"$GITHUB_ENV"
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
      - name: Smoke test the pushed image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: docker run --rm --entrypoint /usr/local/bin/magnetar-server "$IMAGE@$DIGEST" --version
      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          # latest=auto: `latest` only with a semver tag that has no prerelease part.
          flavor: latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=edge,branch=main
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Create the manifest list
        working-directory: ${{ runner.temp }}/digests
        env:
          META_JSON: ${{ steps.meta.outputs.json }}
        run: |
          mapfile -t tags < <(jq -r '.tags[]' <<<"$META_JSON")
          [ "${#tags[@]}" -gt 0 ] || { echo "::error::no tags computed for $GITHUB_REF"; exit 1; }
          args=()
          for t in "${tags[@]}"; do args+=(-t "$t"); done
          sources=()
          for d in *; do sources+=("$IMAGE@sha256:$d"); done
          [ "${#sources[@]}" -eq 2 ] || { echo "::error::expected 2 digests, got ${#sources[@]}"; exit 1; }
          docker buildx imagetools create "${args[@]}" "${sources[@]}"
      - name: Inspect
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: docker buildx imagetools inspect "$IMAGE:$VERSION"
      - name: Anonymous pull works
        # A new GHCR package on a personal account starts private; docs/SETUP.md "Making a
        # release" step 4. Warn rather than fail: the push itself succeeded.
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          repo=${IMAGE#ghcr.io/}
          code=$(curl -s -o token.json -w '%{http_code}' "https://ghcr.io/token?scope=repository:$repo:pull")
          token=$(jq -r '.token // empty' token.json 2>/dev/null || true)
          rm -f token.json
          if [ "$code" = 200 ] && [ -n "$token" ] &&
            curl -sf -o /dev/null -H "Authorization: Bearer $token" \
              -H 'Accept: application/vnd.oci.image.index.v1+json' \
              "https://ghcr.io/v2/$repo/manifests/$VERSION"; then
            echo "$IMAGE:$VERSION is pullable without login"
          else
            echo "::warning::$IMAGE is not pullable without login (token endpoint HTTP $code): make the package public (docs/SETUP.md, Making a release, step 4)"
          fi
