[package]
name = "magnetar-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
downloads = ["dep:librqbit"]
# Title parsing + IMDb ranking (server only; keeps the phone library small).
enrich = ["dep:parse-torrent-title"]
# Native DHT crawler (server only, docs/DHT.md, D49): KRPC node, BEP 51 sampling, passive capture.
dht-crawl = []
# Header probes (docs/PROBES.md, D117): after a metadata fetch, read the few blocks that
# crates/sniff needs to learn real file types. Crawl workers only; never the phone build.
probe = ["dht-crawl", "dep:sniff", "nix/process"]

[dependencies]
nostr.workspace = true
negentropy.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
reqwest.workspace = true
rustls.workspace = true
webpki-roots.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
async-trait.workspace = true
futures.workspace = true
tracing.workspace = true
hex.workspace = true
sha2.workspace = true
sha1_smol.workspace = true
rand.workspace = true
url.workspace = true
percent-encoding.workspace = true
data-encoding.workspace = true
librqbit = { workspace = true, optional = true }
parse-torrent-title = { workspace = true, optional = true }
unicode-normalization = { workspace = true }
sniff = { workspace = true, optional = true }

[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
nix.workspace = true

[target.'cfg(any(target_os = "linux", target_os = "android"))'.dev-dependencies]
# Thread CPU time for the scaling tests (release.rs), so a loaded machine does not fail them.
nix = { workspace = true, features = ["time"] }

[dev-dependencies]
tokio = { workspace = true }
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
