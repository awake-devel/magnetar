# Virtual disks and file system images. ISO 9660 / UDF / raw CD are Rust checks in
# src/formats/disc.rs.

[[rule]]
id = "qcow2"
label = "disc.qcow2"
confidence = 97
type = "string"
value = 'QFI\xfb'
  [[rule.then]]
  offset = 4
  type = "u32be"
  test = "1..=3"
  field = "version"

[[rule]]
id = "vhdx"
label = "disc.vhdx"
confidence = 97
type = "string"
value = "vhdxfile"

[[rule]]
id = "vmdk"
label = "disc.vmdk"
confidence = 96
type = "string"
value = ["KDMV", "# Disk DescriptorFile"]
  [[rule.then]]          # sparse extent version 1-3
  offset = 4
  type = "u32le"
  test = "1..=3"
  optional = true

[[rule]]
id = "vdi"
label = "disc.vdi"
confidence = 97
type = "string"
value = "<<< "
  [[rule.then]]
  offset = 0x40
  type = "u32le"
  test = "0xbeda107f"

[[rule]]
id = "vhd_dynamic"
label = "disc.vhd"
confidence = 96
type = "string"
value = "conectix"

[[rule]]
id = "vhd_fixed"         # footer in the last 512 bytes
label = "disc.vhd"
confidence = 95
offset = -512
type = "string"
value = "conectix"
set = { variant = "fixed" }

[[rule]]
id = "dmg"               # UDIF trailer in the last 512 bytes
label = "disc.dmg"
confidence = 96
offset = -512
type = "string"
value = "koly"
  [[rule.then]]          # UDIF version 4, header size 512
  offset = -508
  type = "u32be"
  test = "4"
  optional = true

[[rule]]
id = "squashfs"
label = "disc.squashfs"
confidence = 95
type = "string"
value = ["hsqs", "sqsh"]
  [[rule.then]]          # block size: a power of two, 4 KiB-1 MiB
  offset = 12
  type = "u32le"
  test = "4096|8192|16384|32768|65536|131072|262144|524288|1048576"
  optional = true

[[rule]]
id = "ext"
label = "disc.ext"
confidence = 95
offset = 0x438
type = "u16le"
test = "0xEF53"
set = { fs = "ext2" }
  [[rule.then]]          # revision level
  offset = 0x418
  type = "u32le"
  test = "<=6"
  [[rule.then]]          # has_journal
  offset = 0x45C
  type = "u32le"
  test = "&4"
  optional = true
  set = { fs = "ext3" }
  [[rule.then]]          # extents
  offset = 0x460
  type = "u32le"
  test = "&0x40"
  optional = true
  set = { fs = "ext4" }
  [[rule.then]]
  offset = 0x478
  type = "cstring"
  len = 16
  field = "volume"
  optional = true

[[rule]]
id = "ntfs"
label = "disc.ntfs"
confidence = 96
offset = 3
type = "string"
value = "NTFS    "
  [[rule.then]]
  offset = 510
  type = "bytes"
  hex = "55AA"

[[rule]]
id = "exfat"
label = "disc.exfat"
confidence = 96
offset = 3
type = "string"
value = "EXFAT   "

[[rule]]
id = "fat12_16"
label = "disc.fat"
confidence = 95
offset = 510
type = "bytes"
hex = "55AA"
  [[rule.then]]
  offset = 54
  type = "string"
  value = "FAT1"

[[rule]]
id = "fat32"
label = "disc.fat"
confidence = 95
offset = 510
type = "bytes"
hex = "55AA"
  [[rule.then]]
  offset = 82
  type = "string"
  value = "FAT32"

[[rule]]
id = "mds"
label = "disc.mds"
confidence = 97
type = "string"
value = "MEDIA DESCRIPTOR"

[[rule]]
id = "nrg_v2"
label = "disc.nrg"
confidence = 92
offset = -12
type = "string"
value = "NER5"
  [[rule.then]]          # chunk table offset inside the file
  offset = -8
  type = "u64be"
  test = "<$size"

[[rule]]
id = "nrg_v1"
label = "disc.nrg"
confidence = 92
offset = -8
type = "string"
value = "NERO"
  [[rule.then]]          # chunk table: a known chunk id at the offset the footer gives
  offset = { at = -4, type = "u32be" }
  type = "string"
  value = ["CUES", "CUEX", "DAOI", "DAOX", "CDTX", "ETNF", "ETN2", "SINF", "MTYP", "DINF", "TOCT", "RELO", "END!"]

[[rule]]
id = "daa"
label = "disc.daa"
confidence = 92
type = "string"
value = 'DAA\0'
  [[rule.then]]          # signature padded with NULs to 16 bytes
  offset = 4
  type = "bytes"
  hex = "000000000000000000000000"
  optional = true

[[rule]]
id = "apfs"              # container superblock: "NXSB" at 32, block size 4096
label = "disc.apfs"
confidence = 95
offset = 32
type = "string"
value = "NXSB"
  [[rule.then]]
  offset = 36
  type = "u32le"
  test = "4096"

[[rule]]
id = "hfsplus"           # volume header at 1024: "H+" version 4 or "HX" version 5
label = "disc.hfsplus"
confidence = 95
offset = 0x400
type = "string"
value = ['H+\0\x04', 'HX\0\x05']
  [[rule.then]]          # allocation block size: a power of two, 512 B-64 KiB
  offset = 0x428
  type = "u32be"
  test = "512|1024|2048|4096|8192|16384|32768|65536"
  optional = true

[[rule]]
id = "btrfs"
label = "disc.btrfs"
confidence = 97
offset = 0x10040
type = "string"
value = "_BHRfS_M"

[[rule]]
id = "xfs"
label = "disc.xfs"
confidence = 95
type = "string"
value = "XFSB"
  [[rule.then]]
  offset = 4
  type = "u32be"
  test = "512..=65536"

[[rule]]
id = "luks"
label = "disc.luks"
confidence = 99
type = "string"
value = 'LUKS\xba\xbe'
  [[rule.then]]
  offset = 6
  type = "u16be"
  test = "1|2"
  field = "version"

[[rule]]
id = "chd"               # MAME CHD (PS1 / PS2 / Saturn / Dreamcast / arcade images)
label = "disc.chd"
confidence = 98
type = "string"
value = "MComprHD"
  [[rule.then]]
  offset = 12
  type = "u32be"
  test = "1..=5"
  field = "version"

[[rule]]
id = "ecm"               # Error Code Modeler (raw CD images with the ECC stripped)
label = "disc.ecm"
confidence = 95
type = "string"
value = 'ECM\0'

[[rule]]
id = "isz"
label = "disc.isz"
confidence = 96
type = "string"
value = "IsZ!"
  [[rule.then]]          # sector size
  offset = 10
  type = "u16le"
  test = "512|2048|2336|2352|2448"
  optional = true
