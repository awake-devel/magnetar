# Document signatures. PDF and Palm database e-books are Rust checks in src/formats/doc.rs;
# ZIP-based documents (EPUB, DOCX, CBZ, ...) come from the ZIP walker.

[[rule]]
id = "postscript"
label = "doc.postscript"
confidence = 95
type = "string"
value = "%!PS"
  [[rule.then]]          # DSC header "%!PS-Adobe-"
  offset = 4
  type = "string"
  value = "-Adobe-"
  optional = true

[[rule]]
id = "eps_dos"
label = "doc.postscript"
confidence = 90
type = "bytes"
hex = "C5D0D3C6"
set = { variant = "eps-dos" }
  [[rule.then]]          # PostScript section offset: right after the 30-byte header
  offset = 4
  type = "u32le"
  test = "30"
  optional = true

[[rule]]
id = "djvu"
label = "doc.djvu"
confidence = 98
type = "string"
value = "AT&TFORM"
  [[rule.then]]
  offset = 12
  type = "string"
  value = ["DJVU", "DJVM", "DJVI"]

[[rule]]
id = "chm"
label = "doc.chm"
confidence = 97
type = "string"
value = "ITSF"
  [[rule.then]]
  offset = 4
  type = "u32le"
  test = "2|3"

[[rule]]
id = "lit"
label = "doc.lit"
confidence = 97
type = "string"
value = "ITOLITLS"

[[rule]]
id = "topaz"
label = "doc.topaz"
confidence = 80
type = "string"
value = "TPZ"
  [[rule.then]]
  offset = 3
  type = "u8"
  test = "0x30|0x33"

[[rule]]
id = "rtf"
label = "doc.rtf"
confidence = 97
type = "bytes"
hex = "7B5C727466"           # {\rtf
  [[rule.then]]          # RTF version 1
  offset = 5
  type = "string"
  value = "1"
  optional = true
