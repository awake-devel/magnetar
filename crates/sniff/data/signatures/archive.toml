# Archive and package signatures. ZIP, RAR, 7z, tar, gzip/zstd peeks, xz, LZMA, xar and OLE
# compound files are Rust checks in src/formats/archive.rs.

[[rule]]
id = "bzip2"
label = "archive.bzip2"
confidence = 99
type = "string"
value = "BZh"
  [[rule.then]]          # block size '1'..'9'
  offset = 3
  type = "u8"
  test = "0x31..=0x39"
  [[rule.then]]          # block magic (pi) or end-of-stream magic (sqrt pi)
  offset = 4
  type = "bytes"
  hex = ["314159265359", "177245385090"]

[[rule]]
id = "lz4"
label = "archive.lz4"
confidence = 97
type = "bytes"
hex = "04224D18"
  [[rule.then]]          # FLG: version 01, reserved bit 1 clear
  offset = 4
  type = "u8"
  mask = 0xC2
  test = "0x40"
  optional = true
    [[rule.then.then]]   # BD: reserved bits clear, block max size 4-7
    offset = 5
    type = "u8"
    mask = 0x8F
    test = "0"
      [[rule.then.then.then]]
      offset = 5
      type = "u8"
      mask = 0x70
      shift = 4
      test = "4..=7"

[[rule]]
id = "lz4_legacy"
label = "archive.lz4"
confidence = 90
type = "bytes"
hex = "02214C18"
set = { variant = "legacy" }
  [[rule.then]]          # first block size <= LZ4_compressBound(8 MiB)
  offset = 4
  type = "u32le"
  test = "1..=0x810000"
  optional = true

[[rule]]
id = "lzip"
label = "archive.lzip"
confidence = 97
type = "string"
value = "LZIP"
  [[rule.then]]          # version 1
  offset = 4
  type = "u8"
  test = "1"
  optional = true
    [[rule.then.then]]   # dictionary size: log2 base 12-29
    offset = 5
    type = "u8"
    mask = 0x1F
    test = "12..=29"

[[rule]]
id = "compress"
label = "archive.compress"
confidence = 70
type = "bytes"
hex = "1F9D"

[[rule]]
id = "zstd_skippable"
label = "archive.zstd"
confidence = 70
type = "u32le"
test = "0x184D2A50..=0x184D2A5F"
note = "skippable frame first"

[[rule]]
id = "cpio_ascii"
label = "archive.cpio"
confidence = 95
type = "string"
value = ["070701", "070702", "070707"]
  [[rule.then]]          # inode (newc: hex) / dev (odc: octal)
  offset = 6
  type = "ascii"
  len = 8
  class = "hex"
  optional = true

[[rule]]
id = "cpio_binary"
label = "archive.cpio"
confidence = 70
type = "bytes"
hex = ["C771", "71C7"]

[[rule]]
id = "warc"
label = "archive.warc"
confidence = 97
type = "string"
value = "WARC/1."
  [[rule.then]]          # WARC/1.0 or WARC/1.1, CRLF
  offset = 7
  type = "string"
  value = ['0\r\n', '1\r\n']
  optional = true

[[rule]]
id = "ar"
label = "archive.ar"
confidence = 95
type = "string"
value = '!<arch>\n'
  [[rule.then]]
  offset = 8
  type = "ascii"
  len = 16
  field = "first_member"
  optional = true
  [[rule.then]]          # Debian: first member is debian-binary
  offset = 8
  type = "string"
  value = "debian-binary"
  optional = true
  label = "package.deb"
  confidence = 99
    [[rule.then.then]]
    offset = 68
    type = "ascii"
    len = 4
    field = "format"
    optional = true

[[rule]]
id = "rpm"
label = "package.rpm"
confidence = 80
type = "bytes"
hex = "EDABEEDB"
  [[rule.then]]          # major version 3 or 4
  offset = 4
  type = "u8"
  test = "3..=4"
  optional = true
  confidence = 98
    [[rule.then.then]]   # package type: binary or source
    offset = 6
    type = "u16be"
    test = "0|1"
    [[rule.then.then]]   # signature type 5 (header-style): the structure that makes 95+
    offset = 78
    type = "u16be"
    test = "5"
    optional = true
  [[rule.then]]
  offset = 10
  type = "cstring"
  len = 66
  field = "name"
  optional = true

[[rule]]
id = "cab"
label = "archive.cab"
confidence = 75
type = "string"
value = "MSCF"
  [[rule.then]]
  offset = 4
  type = "u32le"
  test = "0"
  [[rule.then]]          # format version 1.3
  offset = 24
  type = "bytes"
  hex = "0301"
  optional = true
  confidence = 92
    [[rule.then.then]]   # cabinet size equals the file length
    offset = 8
    type = "u32le"
    test = "=$size"
    optional = true
    confidence = 99

[[rule]]
id = "ace"
label = "archive.ace"
confidence = 97
offset = 7
type = "string"
value = "**ACE**"
  [[rule.then]]          # main header type 0
  offset = 4
  type = "u8"
  test = "0"
  optional = true

[[rule]]
id = "arj"               # main header: id 0x60EA, basic header size, file type 2
label = "archive.arj"
confidence = 90
type = "bytes"
hex = "60EA"
  [[rule.then]]
  offset = 2
  type = "u16le"
  test = "30..=2600"
  [[rule.then]]
  offset = 10
  type = "u8"
  test = "2"

[[rule]]
id = "lzh"               # LHA / LZH level 0-2 headers: method at 2
label = "archive.lzh"
confidence = 95
offset = 2
type = "string"
value = ["-lh0-", "-lh1-", "-lh4-", "-lh5-", "-lh6-", "-lh7-", "-lhd-", "-lzs-", "-lz4-", "-lz5-"]
  [[rule.then]]          # header level 0-2
  offset = 20
  type = "u8"
  test = "0..=2"
  optional = true
    [[rule.then.then]]   # compressed size within the file
    offset = 7
    type = "u32le"
    test = "<=$size"

[[rule]]
id = "zpaq"              # journaling archives start with a "7kSt" locator before "zPQ"
label = "archive.zpaq"
confidence = 95
type = "string"
value = "7kSt"
  [[rule.then]]
  offset = 13
  type = "string"
  value = "zPQ"

[[rule]]
id = "zpaq_stream"
label = "archive.zpaq"
confidence = 90
type = "string"
value = "zPQ"
  [[rule.then]]
  offset = 3
  type = "u8"
  test = "1|2"
  [[rule.then]]          # block type 1 (ZPAQ1)
  offset = 4
  type = "u8"
  test = "1"
  optional = true

[[rule]]
id = "wim"               # Windows imaging (install.wim / install.esd)
label = "archive.wim"
confidence = 98
type = "string"
value = 'MSWIM\0\0\0'

[[rule]]
id = "lzop"
label = "archive.lzop"
confidence = 99
type = "bytes"
hex = "894C5A4F000D0A1A0A"

[[rule]]
id = "stuffit"
label = "archive.stuffit"
confidence = 97
type = "string"
value = "SIT!"
  [[rule.then]]
  offset = 10
  type = "string"
  value = "rLau"

[[rule]]
id = "stuffit5"
label = "archive.stuffit"
confidence = 99
type = "string"
value = ["StuffIt (c)1997-", "StuffIt!"]

[[rule]]
id = "zoo"
label = "archive.zoo"
confidence = 99
type = "string"
value = "ZOO "
  [[rule.then]]
  offset = 20
  type = "u32le"
  test = "0xFDC4A7DC"
