[package]
name = "magnetar-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[features]
default = ["upnp"]
# Router port mappings for the DHT crawler (D57, D72). Without it MAGNETAR_DHT_UPNP is ignored
# (logged) and the ports must be forwarded by hand.
upnp = ["dep:igd-next"]

[[bin]]
name = "magnetar-server"
path = "src/main.rs"

[dependencies]
libc = "0.2"
magnetar-core = { workspace = true, features = ["downloads", "enrich", "dht-crawl"] }
sqlx.workspace = true
axum.workspace = true
tokio.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
async-trait.workspace = true
futures.workspace = true
hex.workspace = true
clap.workspace = true
anyhow.workspace = true
nostr.workspace = true
rand.workspace = true
url.workspace = true
flate2.workspace = true
httpdate.workspace = true
reqwest.workspace = true
sha2.workspace = true
parse-torrent-title.workspace = true
anitomy-ng.workspace = true
ruzstd.workspace = true
tantivy.workspace = true
igd-next = { workspace = true, optional = true }

[dev-dependencies]
tokio-tungstenite.workspace = true
sha1_smol.workspace = true
nostr-sdk = "0.45.4"
nostr-memory = "0.45.2"
